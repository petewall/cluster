---
# Shared PostgreSQL cluster (CloudNativePG) on iSCSI block storage. Hosts the
# mealie and homeassistant databases (see databases.yaml). Single instance —
# homelab; if it restarts, dependent apps reconnect. Roles/databases are added
# declaratively once their password secrets exist (Phase 2b).
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: postgres
  namespace: databases
spec:
  instances: 1
  imageName: ghcr.io/cloudnative-pg/postgresql:17
  storage:
    storageClass: synology-iscsi
    size: 20Gi
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      memory: 2Gi
  managed:
    roles:
      # Passwords come from basic-auth sealed secrets (see Makefile). Each role
      # owns only its own database (databases.yaml) — no superuser.
      - name: mealie
        ensure: present
        login: true
        superuser: false
        passwordSecret:
          name: mealie-db-password
      - name: homeassistant
        ensure: present
        login: true
        superuser: false
        passwordSecret:
          name: homeassistant-db-password
    services:
      # Expose the primary on the LAN for the external Home Assistant (HAOS).
      # In-cluster clients (Mealie) use postgres-rw.databases.svc instead.
      # Connect with sslmode=require — CNPG serves TLS by default.
      additional:
        - selectorType: rw
          serviceTemplate:
            metadata:
              name: postgres-lb
              annotations:
                metallb.universe.tf/loadBalancerIPs: 192.168.1.252
            spec:
              type: LoadBalancer
