---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mealie
  namespace: mealie
  annotations:
    # Mealie's upstream image runs as root and writes throughout /app at runtime;
    # it isn't built for non-root or a read-only root filesystem. Other hardening
    # (drop caps, no privilege escalation) is applied below.
    ignore-check.kube-linter.io/run-as-non-root: "upstream Mealie image is not built to run as non-root"
    ignore-check.kube-linter.io/no-read-only-root-fs: "Mealie writes throughout /app at runtime; not built for a read-only root filesystem"
spec:
  replicas: 1
  strategy:
    type: Recreate  # single RWO volume — don't run two pods at once
  selector:
    matchLabels:
      app: mealie
  template:
    metadata:
      labels:
        app: mealie
    spec:
      containers:
        - name: mealie
          image: ghcr.io/mealie-recipes/mealie:v3.21.0
          # No restrictive securityContext: Mealie's entrypoint starts as root,
          # chowns /app/data, then drops to uid 911 — it needs CAP_CHOWN + setuid
          # (privilege escalation) to do so, so dropping caps / disabling
          # privilege escalation makes it crash-loop.
          ports:
            - containerPort: 9000
              name: http
          env:
            - name: BASE_URL
              value: https://recipes.petewall.net
            - name: DB_ENGINE
              value: postgres
            - name: POSTGRES_SERVER
              value: postgres-rw.databases.svc.cluster.local
            - name: POSTGRES_PORT
              value: "5432"
            - name: POSTGRES_DB
              value: mealie
            - name: POSTGRES_USER
              value: mealie
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mealie-db-password
                  key: password
            # AI features via the in-cluster Ollama (OpenAI-compatible endpoint).
            # Text-only — image services stay off (vision on CPU is impractical).
            - name: OPENAI_BASE_URL
              value: http://ollama.ollama.svc.cluster.local:11434/v1
            - name: OPENAI_API_KEY
              value: ollama  # required by Mealie but ignored by Ollama
            - name: OPENAI_MODEL
              value: qwen2.5:7b-instruct
            - name: OPENAI_ENABLE_IMAGE_SERVICES
              value: "false"
            - name: OPENAI_REQUEST_TIMEOUT
              value: "300"  # CPU inference is slow
          readinessProbe:
            httpGet:
              path: /api/app/about
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/app/about
              port: http
            initialDelaySeconds: 30
            periodSeconds: 15
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
            limits:
              memory: 1Gi
          volumeMounts:
            - name: data
              mountPath: /app/data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: mealie-data
