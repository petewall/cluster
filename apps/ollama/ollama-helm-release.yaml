---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: ollama-helm
  namespace: ollama
spec:
  interval: 1h0m0s
  url: https://otwld.github.io/ollama-helm/
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: ollama
  namespace: ollama
spec:
  interval: 1h0m0s
  # First boot pulls a ~4.7Gi model before the Deployment goes Ready; give Helm
  # room past its 5m default so the install isn't marked Failed while the pull is
  # still in flight. Subsequent installs reuse the model on the PVC.
  timeout: 20m0s
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  chart:
    spec:
      chart: ollama
      version: 1.70.0
      sourceRef:
        kind: HelmRepository
        name: ollama-helm
  values:
    # Predictable service DNS: ollama.ollama.svc.cluster.local:11434
    fullnameOverride: ollama
    replicaCount: 1

    # The chart's helm-test Pod is an unhardened busybox image (trips
    # kube-linter and never runs under Flux anyway).
    tests:
      enabled: false

    ollama:
      gpu:
        enabled: false
      models:
        # Text model for Mealie's AI features (ingredient/recipe parsing) via the
        # OpenAI-compatible endpoint. CPU-only, single-shot (~tens of seconds).
        pull:
          - qwen2.5:7b-instruct

    persistentVolume:
      enabled: true
      storageClass: synology-iscsi
      size: 30Gi

    service:
      type: ClusterIP
      port: 11434

    # Sized for a 7B Q4 model on CPU (~5-6Gi resident) with headroom on the
    # 16Gi nodes. No CPU limit (repo convention); requests reserve a core.
    resources:
      requests:
        cpu: "1"
        memory: 6Gi
      limits:
        memory: 12Gi

    # Harden what the upstream chart allows. Root is required: the chart mounts
    # the PVC at /root/.ollama and ollama runs as root. Root FS is read-only
    # (models live on the PVC; /tmp is an emptyDir), caps dropped, no priv esc.
    securityContext:
      readOnlyRootFilesystem: true
      allowPrivilegeEscalation: false
      capabilities:
        drop:
          - ALL

    volumes:
      - name: tmp
        emptyDir: {}
    volumeMounts:
      - name: tmp
        mountPath: /tmp

    # First-boot model pull blocks the readiness gate for minutes; give it room
    # before the probes start failing the pod.
    livenessProbe:
      initialDelaySeconds: 60
      failureThreshold: 30
    readinessProbe:
      initialDelaySeconds: 60
      failureThreshold: 30

  # The chart exposes no annotation values, so mark the accepted run-as-root
  # trait for kube-linter via a postRenderer (inert at runtime; the lint render
  # script applies the same patch so CI and the cluster stay in sync).
  postRenderers:
    - kustomize:
        patches:
          - target:
              kind: Deployment
              name: ollama
            patch: |
              apiVersion: apps/v1
              kind: Deployment
              metadata:
                name: ollama
                annotations:
                  ignore-check.kube-linter.io/run-as-non-root: "the ollama chart mounts the PVC at /root/.ollama and runs as root; it runs with a read-only root FS and all caps dropped otherwise"
