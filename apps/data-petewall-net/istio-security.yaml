---
# Require mTLS for all inbound traffic.
apiVersion: security.istio.io/v1
kind: PeerAuthentication
metadata:
  name: default
  namespace: data-petewall-net
spec:
  mtls:
    mode: STRICT
---
# Only the istio ingress gateway may reach it. Kubelet probes are auto-exempted
# by istio's probe rewrite.
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: allow-ingressgateway
  namespace: data-petewall-net
spec:
  action: ALLOW
  rules:
    - from:
        - source:
            principals:
              - cluster.local/ns/istio-system/sa/istio-ingressgateway
---
# Static file server makes no external calls — lock egress to the registry only.
apiVersion: networking.istio.io/v1
kind: Sidecar
metadata:
  name: default
  namespace: data-petewall-net
spec:
  outboundTrafficPolicy:
    mode: REGISTRY_ONLY
  egress:
    - hosts:
        - "./*"  # own namespace
        - "istio-system/*"  # control plane
        - "kube-system/*"  # CoreDNS
