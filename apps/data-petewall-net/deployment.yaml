---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: data-petewall-net
  namespace: data-petewall-net
  annotations:
    ignore-check.kube-linter.io/run-as-non-root: "nginx workers run as root to read the root-owned synology-csi NFS share; otherwise confined (read-only root FS, dropped caps, no privilege escalation, read-only data mount)"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: data-petewall-net
  template:
    metadata:
      labels:
        app: data-petewall-net
    spec:
      containers:
        - name: nginx
          image: nginx:1.27-alpine
          command: ["nginx", "-g", "daemon off;"]  # skip the entrypoint templating (read-only FS)
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          ports:
            - containerPort: 8080
              name: http
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 2
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 15
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              memory: 64Mi
          volumeMounts:
            - name: data
              mountPath: /data
              readOnly: true
            - name: nginx-config
              mountPath: /etc/nginx/nginx.conf
              subPath: nginx.conf
              readOnly: true
            - name: cache
              mountPath: /var/cache/nginx
            - name: run
              mountPath: /var/run
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: data
        - name: nginx-config
          configMap:
            name: nginx-config
        - name: cache
          emptyDir: {}
        - name: run
          emptyDir: {}
