---
apiVersion: v1
kind: Service
metadata:
  name: tesserae
  namespace: tesserae
spec:
  type: ClusterIP
  selector:
    app: tesserae
  ports:
    - name: http
      port: 80
      targetPort: http
    - name: mqtt
      port: 1883
      targetPort: mqtt  # built-in broker; only needed if a device uses MQTT instead of REST
