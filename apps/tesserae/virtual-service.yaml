---
# LAN-only exposure via the internal gateway (192.168.1.253). Reachable from the
# LAN at https://tesserae.internal.petewall.net; not port-forwarded, so not from
# the internet. Gateway → pod traffic is mTLS; istio-security.yaml restricts the
# pod to this gateway's service account.
apiVersion: networking.istio.io/v1
kind: VirtualService
metadata:
  name: tesserae
  namespace: tesserae
spec:
  hosts:
    - tesserae.internal.petewall.net
  gateways:
    - istio-system/internal-petewall-net-gateway
  http:
    - route:
        - destination:
            host: tesserae
            port:
              number: 80
