---
# Meshed: sidecars enforce STRICT mTLS and only the LAN ingress gateway may
# connect (see istio-security.yaml). Side effect: `kubectl port-forward` to pods
# here no longer works (kubelet can't present a mesh identity); use
# https://tesserae.internal.petewall.net from the LAN instead.
apiVersion: v1
kind: Namespace
metadata:
  name: tesserae
  labels:
    istio-injection: enabled
