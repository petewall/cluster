---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: grafana
  namespace: monitoring
spec:
  interval: 1h0m0s
  url: https://grafana.github.io/helm-charts
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: k8s-monitoring
  namespace: monitoring
spec:
  chart:
    spec:
      chart: k8s-monitoring
      version: 4.6.1
      sourceRef:
        kind: HelmRepository
        name: grafana
  interval: 1h0m0s
  values:
    cluster:
      name: wallhouse
    destinations:
      grafana-cloud-metrics:
        type: prometheus
        urlFrom: nonsensitive(remote.kubernetes.secret.grafana_cloud_metrics.data["metricsUrl"])
        auth:
          type: basic
          usernameKey: metricsUsername
          passwordKey: metricsPassword
        secret:
          create: false
          name: grafana-cloud
      grafana-cloud-logs:
        type: loki
        urlFrom: nonsensitive(remote.kubernetes.secret.grafana_cloud_logs.data["logsUrl"])
        auth:
          type: basic
          usernameKey: logsUsername
          passwordKey: logsPassword
        secret:
          create: false
          name: grafana-cloud

    telemetryServices:
      node-exporter:
        deploy: true
    
      kube-state-metrics:
        deploy: true
        # Passed through to the kube-state-metrics subchart. Sized to observed
        # ~32Mi/4m peak; memory limit for headroom, no CPU limit.
        resources:
          requests:
            cpu: 10m
            memory: 64Mi
          limits:
            memory: 128Mi
    
      beyla:
        deploy: true
        k8sCache:
          replicas: 1
    
      opencost:
        deploy: true
        metricsSource: custom
        opencost:
          exporter:
            defaultClusterId: wallhouse
          prometheus:
            existingSecretName: grafana-cloud
            username_key: metricsUsername
            password_key: metricsPassword
            external:
              url: "https://prometheus-prod-10-prod-us-central-0.grafana.net/api/prom"
    
      kepler:
        deploy: true
    
      k8s-manifest-tail:
        deploy: true
        config:
          objects:
            - { apiVersion: v1, kind: Pod }
            - { apiVersion: apps/v1, kind: Deployment }
            - { apiVersion: apps/v1, kind: StatefulSet }
            - { apiVersion: apps/v1, kind: DaemonSet }
    
      sdkInjector:
        deploy: true
        allowedConfigMapWriters: system:serviceaccount:monitoring:grafana-cloud-alloy-daemonset,system:serviceaccount:monitoring:grafana-cloud-alloy-deployment


    alloy-operator:
      # Passed through to the alloy-operator subchart. Sized to observed
      # ~53Mi/11m peak; memory limit for headroom, no CPU limit.
      resources:
        requests:
          cpu: 15m
          memory: 64Mi
        limits:
          memory: 128Mi
      # Resources for the finalizer hook Jobs (add on install, remove+wait on
      # uninstall) — tiny one-shot kubectl runs.
      waitForAlloyRemoval:
        resources:
          requests:
            cpu: 10m
            memory: 32Mi
          limits:
            memory: 64Mi

    collectors:
      alloy-daemonset:
        presets: [root, host-network, host-storage, host-cgroup, clustered, service-discovery, filesystem-log-reader, daemonset]
        alloy:
          extraEnv:
            - name: GCLOUD_RW_API_KEY
              valueFrom:
                secretKeyRef:
                  name: grafana-cloud-fleet-management
                  key: password
                  optional: false
        remoteConfig:
          enabled: true
          urlFrom: nonsensitive(remote.kubernetes.secret.alloy_daemonset_remote_cfg.data["url"])
          auth:
            type: basic
          secret:
            create: false
            name: grafana-cloud-fleet-management
            namespace: monitoring
