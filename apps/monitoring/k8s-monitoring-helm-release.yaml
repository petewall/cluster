---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: grafana
  namespace: monitoring
spec:
  interval: 1h0m0s
  url: https://grafana.github.io/helm-charts
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: k8s-monitoring
  namespace: monitoring
spec:
  chart:
    spec:
      chart: k8s-monitoring
      version: 4.6.0
      sourceRef:
        kind: HelmRepository
        name: grafana
  interval: 1h0m0s
  values:
    cluster:
      name: wallhouse
    destinations:
      grafana-cloud-metrics:
        type: prometheus
        urlFrom: nonsensitive(remote.kubernetes.secret.grafana_cloud_metrics.data["metricsUrl"])
        auth:
          type: basic
          usernameKey: metricsUsername
          passwordKey: metricsPassword
        secret:
          create: false
          name: grafana-cloud
      grafana-cloud-logs:
        type: loki
        urlFrom: nonsensitive(remote.kubernetes.secret.grafana_cloud_logs.data["logsUrl"])
        auth:
          type: basic
          usernameKey: logsUsername
          passwordKey: logsPassword
        secret:
          create: false
          name: grafana-cloud

    clusterMetrics:
      enabled: true
      kube-state-metrics:
        # container_id (containerd://<hash>) is unique per container instance and
        # changes on every restart, so it churns active series. Drop it from KSM
        # metrics — it rides on kube_pod_container_info and isn't queried.
        extraMetricProcessingRules: |
          rule {
            action = "labeldrop"
            regex  = "container_id"
          }

    hostMetrics:
      enabled: true
      linuxHosts:
        enabled: true
        source: alloy

    clusterEvents:
      enabled: true
      clustering: true

    podLogsViaLoki:
      enabled: true

    integrations:
      collector: alloy
      alloy:
        instances:
          - name: alloy
            namespaces: [monitoring]
            labelSelectors:
              app.kubernetes.io/name: alloy
            # Keep only alloy_build_info — the alloy_component_* metrics were
            # ~880 high-cardinality series we don't use.
            metrics:
              tuning:
                useDefaultAllowList: false
                includeMetrics:
                  - alloy_build_info

      cert-manager:
        instances:
          - name: cert-manager
            namespaces: [cert-manager]
            labelSelectors:
              app.kubernetes.io/name: cert-manager

      # istio integration disabled — not using mesh dashboards; dropped ~500
      # series (sidecar + istiod metrics).

    telemetryServices:
      kube-state-metrics:
        deploy: true
        # Passed through to the kube-state-metrics subchart. Sized to observed
        # ~32Mi/4m peak; memory limit for headroom, no CPU limit.
        resources:
          requests:
            cpu: 10m
            memory: 64Mi
          limits:
            memory: 128Mi

    alloy-operator:
      # Passed through to the alloy-operator subchart. Sized to observed
      # ~53Mi/11m peak; memory limit for headroom, no CPU limit.
      resources:
        requests:
          cpu: 15m
          memory: 64Mi
        limits:
          memory: 128Mi
      # Resources for the finalizer hook Jobs (add on install, remove+wait on
      # uninstall) — tiny one-shot kubectl runs.
      waitForAlloyRemoval:
        resources:
          requests:
            cpu: 10m
            memory: 32Mi
          limits:
            memory: 64Mi

    collectors:
      alloy:
        presets: [clustered, filesystem-log-reader, linux-host-monitor, daemonset]
        # Register with Grafana Cloud Fleet Management. The chart appends a
        # remotecfg block to the locally generated config, so the pipelines above
        # keep running and Fleet Management pipelines are layered on top.
        # Credentials come in as env vars (rather than secret.create: false)
        # because the chart would otherwise also read tls ca/cert/key keys from
        # the external secret, which don't exist. extraEnv replaces the preset's
        # list, so NODE_NAME (from linux-host-monitor) is restated here.
        alloy:
          extraEnv:
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: FLEET_MANAGEMENT_URL
              valueFrom:
                secretKeyRef:
                  name: grafana-cloud-fleet-management
                  key: url
                  optional: true
            - name: FLEET_MANAGEMENT_USERNAME
              valueFrom:
                secretKeyRef:
                  name: grafana-cloud-fleet-management
                  key: username
                  optional: true
            - name: GCLOUD_RW_API_KEY
              valueFrom:
                secretKeyRef:
                  name: grafana-cloud-fleet-management
                  key: password
                  optional: true
        remoteConfig:
          enabled: true
          urlFrom: sys.env("FLEET_MANAGEMENT_URL")
          auth:
            type: basic
            usernameFrom: sys.env("FLEET_MANAGEMENT_USERNAME")
            passwordFrom: sys.env("GCLOUD_RW_API_KEY")
